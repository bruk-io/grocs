# Pre-commit runs the same scripts the agent hooks and CI run (R55). Install with: pnpm hooks:install
pre-commit:
  parallel: false
  commands:
    checks:
      # Every check over the repo, plus the review of the staged diff for weakened checks (R57).
      run: node tools/checks/run.ts --mode staged
    typecheck:
      run: pnpm -s typecheck
    unit-tests:
      run: pnpm -s test
