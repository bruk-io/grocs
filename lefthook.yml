# Pre-commit runs the same scripts the agent hooks and CI run (R55). Install with: pnpm hooks:install
post-checkout:
  commands:
    install:
      # Fires for every checkout, including a brand-new agent worktree (DRAFT-2): node_modules
      # is gitignored, so a fresh worktree starts with none and a layer builder's narrowed Bash
      # cannot install for itself. Only installs when it is actually missing.
      run: node tools/hooks/post-checkout.ts

pre-commit:
  parallel: false
  commands:
    checks:
      # Every check over the repo, plus the review of the staged diff for weakened checks (R57).
      run: node tools/checks/run.ts --mode staged
    typecheck:
      run: pnpm -s typecheck
    unit-tests:
      # Skipped when every staged file is under backlog/ - a pure board change cannot break a test.
      run: node tools/hooks/unit-tests.ts
