<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"urn:nyt:ScoopRecipe:3da6a2f9f2fa5bb398511415528d3e46","@type":"Recipe","aggregateRating":{"@type":"AggregateRating","ratingCount":17265,"ratingValue":5},"author":{"@id":"nyt://person/0f1a5b18-7e38-59fe-8132-b5015cd37148","@type":"Person","name":"The New York Times","url":"https://www.nytimes.com/by/the-new-york-times"},"comment":[{"@type":"Comment","author":{"@type":"Person","name":"Sofia"},"datePublished":"2026-11-03T18:15:02Z","text":"Made with fresh tomatoes and doubled recipe. Essential additions: 1/4 cup of chopped fresh basil, and a pinch or two of Baharat and Maras near the end."},{"@type":"Comment","author":{"@type":"Person","name":"Fran"},"datePublished":"2026-10-21T16:10:50Z","text":"The simplicity of this sauce belies its complex and utterly delicious taste. I made a decent sized batch and almost sampled half of it before getting it in a freezer container.\nIt would make cardboard edible!"},{"@type":"Comment","author":{"@type":"Person","name":"Susan Paul"},"datePublished":"2026-10-21T13:17:44Z","text":"I have made this many times and it always is a delight.  HOWEVER...the last time I made it, I added some chopped fresh red bell pepper to the fresh tomatoes and butter.  The resulting flavor was remarkably deepened by this simple addition.  It was superb.  And..I add the raw onion when chopped, at the beginning of cooking the tomatoes and pepper.  It disappears in the sauce."},{"@type":"Comment","author":{"@type":"Person","name":"Rob"},"datePublished":"2026-10-20T10:00:15Z","text":"This is of course incredibly simple to make and the result is passable but has no mid-palate. Sweet and acidic up front. Then a buttery finish. No savoury depth in the middle. There is a reason why cuisines across the world tend to first cook aromatic vegetables in fat or oil: from Thai Curry, to jollof rice, to risotto, to chile con carne. It gives the depth of flavour."},{"@type":"Comment","author":{"@type":"Person","name":"Bob"},"datePublished":"2026-10-15T07:45:17Z","text":"Best Tomato Soup I ever made"},{"@type":"Comment","author":{"@type":"Person","name":"Melva L"},"datePublished":"2026-10-09T19:15:21Z","text":"After having this recipe set aside \"to try\" for years, I happened to have 4# of perfectly ripe Roma tomatoes. After peeling etc ended up with three quart of roughly chopped tomatoes.  One large onion and one huge shallot, tomatoes and four 4 ample ounces of butter.  That's it.  A divine recipe. I really do not know why it's taken me years to try it ..."},{"@type":"Comment","author":{"@type":"Person","name":"MStanDC"},"datePublished":"2026-10-04T17:33:29Z","text":"Absolute perfection. Agree w other commenters re adding the pinch of sugar."},{"@type":"Comment","author":{"@type":"Person","name":"SusieQ"},"datePublished":"2026-10-04T16:58:53Z","text":"Sometimes in the middle of the night when I can't sleep I read the comments of a NYT recipe. Makes me feel relaxed and happy!  Like I'm sitting cosy in your kitchens."},{"@type":"Comment","author":{"@type":"Person","name":"Stepan"},"datePublished":"2026-10-02T18:14:46Z","text":"Is there any conversion here to fresh tomatoes? I have a fridge full of tomatoes from the garden and any recipe I find asks for imported Italian tomatoes."},{"@type":"Comment","author":{"@type":"Person","name":"Nojoa"},"datePublished":"2026-09-26T11:47:26Z","text":"I’ve made this twice now. The first time, I couldn’t bring myself to waste the onion so I’m improvised. Try keeping the onion and take your immersion blender to this sauce - it’s DIVINE!  Those I’ve made it for do not believe me when I tell them it’s only four ingredients. Even when they watch me put all in the pot."},{"@type":"Comment","author":{"@type":"Person","name":"Carol"},"datePublished":"2026-09-24T15:41:19Z","text":"Fresh tomatoes — core and cut larger tomatoes in half/big chunks, cook on medium for 25 mins, purée, then add butter and onion to purée and continue cooking 45 mins per recipe"},{"@type":"Comment","author":{"@type":"Person","name":"Ruth Jacobson"},"datePublished":"2026-09-16T02:16:17Z","text":"I'm with those who don't understand the enthusiasm for this sauce. Love Marcella's cookbook, which I have had and used happily for years, but this sauce, to me, is just bland and blah. Tomato soup-ish, as some have said. Will not be making this one again."},{"@type":"Comment","author":{"@type":"Person","name":"Zaphelps"},"datePublished":"2026-09-14T16:37:01Z","text":"After making this a million times and reluctantly disposing of the onions, I made a huge batch and then made soup from the onions, a couple of carrots and two big russet potatoes. Delicious! I’ll never throw away the onions again!"},{"@type":"Comment","author":{"@type":"Person","name":"Eric Anderson"},"datePublished":"2026-09-07T21:44:37Z","text":"Tasting this for the first time was a delightful shock. I’ve been making various tomato sauces for 40 years. There’s always been at least onion, garlic and basil. More complex sauces were a mirepoix and half a dozen herbs. But this, nothing changed, nothing added was as interesting and flavorful as any in my repertoire."},{"@type":"Comment","author":{"@type":"Person","name":"Theresa"},"datePublished":"2026-09-03T07:07:19Z","text":"This recipe is a game changer.  Make it.  I make it all time, it is simple, delicious and elevates anything you put with it.  I make it even more simply in my Thermomix."},{"@type":"Comment","author":{"@type":"Person","name":"Caroline"},"datePublished":"2015-10-30T20:40:06Z","text":"Such endless tinkering! My daughter turned me on to this. She said that its simplicity allows the primary ingredients--the tomatoes and the pasta--to shine. The onion is a whisper, not a shout (or, God forbid, a partner with garlic in a mugging). The butter, astonishingly, adds an unctuousness, a luxurious velvety taste and feel that perfectly complement the tomatoes. <br/><br/>If anyone else had told me this, I would have reached for my herb garden, the olive oil. But I trust her, and she was right."},{"@type":"Comment","author":{"@type":"Person","name":"anne"},"datePublished":"2015-06-14T14:31:08Z","text":"The recipe from the first edition of The Classic Italian Cookbook (1973) calls for 2 lbs of tomatoes, 1/4 lb butter, one medium yellow onion, peeled and halved, salt and 1/4 teaspoon granulated sugar. I can't imagine why the amount of butter has been reduced from 8 tablespoons to 5 tablespoons. Stick with the original."},{"@type":"Comment","author":{"@type":"Person","name":"TJ"},"datePublished":"2015-11-30T21:29:06Z","text":"I don't know why you would want to discard the onion. Eating it is one of the highlights of this dish!"},{"@type":"Comment","author":{"@type":"Person","name":"Steve Martin"},"datePublished":"2016-02-07T11:21:07Z","text":"Leave the ends of the onion intact and halve it end to end instead of at the equator and the onion will stay together."},{"@type":"Comment","author":{"@type":"Person","name":"David"},"datePublished":"2016-07-24T11:37:14Z","text":"Made this tonight--very good; so simple. As others said, on my own, I would have reached for basil, garlic, etc; is not necessary here.<br/><br/>The one thing I would add is don't forgot everything you know about pasta. So salt the spaghetti water properly, and then combine spaghetti w/ sauce in a saute pan by heating sauce in pan, adding a ladle of spaghetti water (to help it adhere), letting it come to simmer, and finishing the spaghetti in the sauce (for the last two minutes of cook time)"},{"@type":"Comment","author":{"@type":"Person","name":"JimTx"},"datePublished":"2016-06-29T13:21:42Z","text":"Sounds good, but I'm not discarding the onion.  That's the best part.  I'll eat that all by itself if I have to, or puree it into its own sauce with a little roasted garlic to spread on some good bread."},{"@type":"Comment","author":{"@type":"Person","name":"Bill"},"datePublished":"2016-08-30T12:31:37Z","text":"Folks, recipes are just a guide.   As I read the comments I really chuckle at how scared people are to adjust things to their preferences.  If you like garlic, add some.  A little more butter, why not.  I have been making this over the past few weeks with fresh tomatoes from my garden, why not ?  I cannot keep up with them otherwise.  I have fine tuned it to my liking,  half an onion sliced, clove of garlic, hint of fresh basil and oregano, and reduce over several hours at very low heat. YUM."},{"@type":"Comment","author":{"@type":"Person","name":"CV"},"datePublished":"2015-08-22T08:40:08Z","text":"This recipe calls for 2 CUPS of tomatoes, not 2 pounds. Maybe that's why there's less butter."},{"@type":"Comment","author":{"@type":"Person","name":"michael nichols"},"datePublished":"2016-03-29T12:05:30Z","text":"i didn't have enough butter so added some duck fat.  God help us all...   BUT it was DELICIOUS."},{"@type":"Comment","author":{"@type":"Person","name":"Daniel Barenberg"},"datePublished":"2016-10-21T15:28:58Z","text":"Just want to put it out there that the \"Bianco Dinapoli\" brand canned tomatoes from California are better than nearly every brand of canned tomatoes I have tried, from muir glen to various DOP san marzano brands.  Best of all they are less than $4/can at whole foods.  They work for pizza sauce, tomatoe sauce, and soup, all wonderfully."},{"@type":"Comment","author":{"@type":"Person","name":"ET"},"datePublished":"2016-04-28T11:23:28Z","text":"This recipe isn't a life-changer but it's so easy and I always have the ingredients on hand. I add a healthy pinch of crushed red pepper. I think it's a little scant for a whole pound of pasta - I use one recipe's worth of sauce on half a pound of pasta. Add meatballs and it's dinner for three adults.<br/><br/>If you don't have San Marzano tomatoes, Cooks Illustrated says Hunts is the next best thing."},{"@type":"Comment","author":{"@type":"Person","name":"Iz"},"datePublished":"2017-01-22T08:54:52Z","text":"\"...a partner with garlic in a mugging...\" That made me laugh. Very charming"},{"@type":"Comment","author":{"@type":"Person","name":"rubiconrich"},"datePublished":"2016-09-08T17:08:38Z","text":"I am 68 years old. Been adding sweet butter to my gravy since I was old enough to cook. Southern Italians always did this. Many also use red bell peppers as a sweetener in addition to the butter. Never use sugar or salt and never had a complaint. Of course, I simmer for 5 to 8 hours depending on what gravy I am making. By the way, butter is one step away from heavy cream. If you whip cream enough, it will turn into butter. Parmesan is bland. Romano has taste!"},{"@type":"Comment","author":{"@type":"Person","name":"Maria DeCarvalho"},"datePublished":"2015-03-31T11:38:09Z","text":"I happened to be out of onions so I used four large shallots, some of which sort of melted into the sauce.  I liked it even better."},{"@type":"Comment","author":{"@type":"Person","name":"ccriegel"},"datePublished":"2017-12-09T18:21:36Z","text":"when I get too stressed out -- I read the comments on this thread. The wonderful thoughtful discussions calm me right down. Thank you all"}],"commentCount":1716,"copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2013,"dateModified":"2026-10-28T14:10:47.616Z","datePublished":"2013-10-01T00:00:00Z","description":"This is perhaps the most famous recipe created by Marcella Hazan, the cookbook author who changed how Americans cook Italian food. It also may be her easiest. Use your favorite canned tomatoes for this and don’t be scared off by the butter. It gives the sauce an unparalleled velvety richness. The New York Times Click here for more of our best pasta recipes.","image":[{"@id":"nyt://image/c1c8a36a-c6d1-59fa-a0fd-e317b1247d8c#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-videoSixteenByNineJumbo1600.jpg","creditText":"Christopher Testani for The New York Times. Simon Andrews.","dateModified":"2024-08-05T17:45:34.919Z","datePublished":"2024-08-05T17:45:34.919Z","height":"900","uploadDate":"2024-08-05T17:45:34.919Z","url":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-videoSixteenByNineJumbo1600.jpg","width":"1600"},{"@id":"nyt://image/c1c8a36a-c6d1-59fa-a0fd-e317b1247d8c#googleFourByThree","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-googleFourByThree.jpg","creditText":"Christopher Testani for The New York Times. Simon Andrews.","dateModified":"2024-08-05T17:45:34.919Z","datePublished":"2024-08-05T17:45:34.919Z","height":"600","uploadDate":"2024-08-05T17:45:34.919Z","url":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-googleFourByThree.jpg","width":"800"},{"@id":"nyt://image/c1c8a36a-c6d1-59fa-a0fd-e317b1247d8c#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-mediumSquareAt3X.jpg","creditText":"Christopher Testani for The New York Times. Simon Andrews.","dateModified":"2024-08-05T17:45:34.919Z","datePublished":"2024-08-05T17:45:34.919Z","height":"1799","uploadDate":"2024-08-05T17:45:34.919Z","url":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-mediumSquareAt3X.jpg","width":"1800"},{"@id":"nyt://image/c1c8a36a-c6d1-59fa-a0fd-e317b1247d8c#facebookJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-facebookJumbo.jpg","creditText":"Christopher Testani for The New York Times. Simon Andrews.","dateModified":"2024-08-05T17:45:34.919Z","datePublished":"2024-08-05T17:45:34.919Z","height":"550","uploadDate":"2024-08-05T17:45:34.919Z","url":"https://static01.nyt.com/images/2024/08/05/multimedia/Marcella-Hazan-Tomato-Sauce-jpcf/Marcella-Hazan-Tomato-Sauce-jpcf-facebookJumbo.jpg","width":"1050"}],"isAccessibleForFree":false,"mainEntityOfPage":{"@id":"//cooking.nytimes.com/recipes/1015178-marcella-hazans-tomato-sauce","@type":"WebPage","name":"Marcella Hazan’s Tomato Sauce"},"name":"Marcella Hazan’s Tomato Sauce","nutrition":{"@type":"NutritionInformation","calories":"153","carbohydrateContent":"5.8 grams","cholesterolContent":"38.2 milligrams","fatContent":"14.6 grams","fiberContent":"1.4 grams","proteinContent":"1.2 grams","saturatedFatContent":"9 grams","sodiumContent":"287.2 milligrams","sugarContent":"3.3 grams","unsaturatedFatContent":"0.6 grams"},"publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"recipeIngredient":["2 cups tomatoes, in addition to their juices (for example, a 28-ounce can of San Marzano whole peeled tomatoes)","5 tablespoons butter","1 onion, peeled and cut in half","Salt"],"recipeInstructions":[{"@type":"HowToStep","text":"Combine the tomatoes, their juices, the butter and the onion halves in a saucepan. Add a pinch or two of salt.","url":"https://cooking.nytimes.com/recipes/1015178-marcella-hazans-tomato-sauce#recipe-step-1"},{"@type":"HowToStep","text":"Place over medium heat and bring to a simmer. Cook, uncovered, for about 45 minutes. Stir occasionally, mashing any large pieces of tomato with a spoon. Add salt as needed.","url":"https://cooking.nytimes.com/recipes/1015178-marcella-hazans-tomato-sauce#recipe-step-2"},{"@type":"HowToStep","text":"Discard the onion before tossing the sauce with pasta. This recipe makes enough sauce for a pound of pasta.","url":"https://cooking.nytimes.com/recipes/1015178-marcella-hazans-tomato-sauce#recipe-step-3"}],"recipeYield":"4 servings","totalTime":"PT1H","url":"//cooking.nytimes.com/recipes/1015178-marcella-hazans-tomato-sauce","video":{"@id":"nyt://video/54487716-4ef3-59f8-a615-6b98d76b8f30","@type":"VideoObject","author":{"@id":"nyt://person/a89444f5-07d8-5c29-86d1-3c6c30133277","@type":"Person","name":"The New York Times Cooking","url":"https://www.nytimes.com/by/the-new-york-times-cooking"},"bitrate":"1446687","contentSize":"2131172","contentUrl":"https://vp.nyt.com/video/2025/10/10/151441_1_Marcella-Hazans-Tomato-Sauce-Vertical-Video_wg_480p.mp4","creator":{"@id":"nyt://person/a89444f5-07d8-5c29-86d1-3c6c30133277","@type":"Person","name":"The New York Times Cooking"},"dateModified":"2025-10-10T18:01:27.485Z","datePublished":"2025-10-10T18:01:27.485Z","duration":"PT10S","height":"480","name":"Marcella Hazan’s Tomato Sauce","publisher":{"@id":"https://www.nytimes.com/#publisher","@type":"NewsMediaOrganization","name":"The New York Times"},"thumbnail":[{"@id":"nyt://image/a9f1bf0e-6bee-506b-99d7-be6cfba9f911#videoSixteenByNineJumbo1600","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/10/11/arts/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02-videoSixteenByNineJumbo1600.png","dateModified":"2025-10-10T18:01:25.697Z","datePublished":"2025-10-10T18:01:25.697Z","height":"608","uploadDate":"2025-10-10T18:01:25.697Z","url":"https://static01.nyt.com/images/2025/10/11/arts/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02-videoSixteenByNineJumbo1600.png","width":"1080"},{"@id":"nyt://image/a9f1bf0e-6bee-506b-99d7-be6cfba9f911#googleFourByThree","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2025/10/11/arts/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02-googleFourByThree.png","dateModified":"2025-10-10T18:01:25.697Z","datePublished":"2025-10-10T lla-Hazans-Tomato-Sauce_MW_Thumb02-mediumSquareAt3X.png","https://static01.nyt.com/images/2025/10/11/arts/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02/20251003_KS_Marcella-Hazans-Tomato-Sauce_MW_Thumb02-facebookJumbo.png"],"transcript":"Possibly the most famous tomato sauce in all of America. Tomatoes, butter, a half an onion, a pinch of salt. That’s it. Trust the simplicity of this sauce.","uploadDate":"2025-10-10T18:01:27.485Z","url":"https://www.nytimes.com/video/embedded/dining/100000010452435/marcella-hazans-tomato-sauce.html","width":"270"}}</script>
