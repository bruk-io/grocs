<!DOCTYPE html>
<html>
<head>
<title>Hand-made: Recipe under mainEntity</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "mainEntity": {
    "@type": "Recipe",
    "name": "Hand-made Mushroom Risotto",
    "recipeYield": "4 servings",
    "image": "https://example.invalid/mushroom-risotto.jpg",
    "recipeIngredient": [
      "1 1/2 cups arborio rice",
      "4 cups vegetable stock",
      "8 ounces mushrooms, sliced",
      "1/2 cup grated parmesan"
    ],
    "recipeInstructions": [
      { "@type": "HowToStep", "text": "Saute the mushrooms until golden." },
      { "@type": "HowToStep", "text": "Add the rice and toast for a minute." },
      { "@type": "HowToStep", "text": "Add stock a ladle at a time, stirring, until creamy." },
      { "@type": "HowToStep", "text": "Stir in the parmesan and serve." }
    ]
  }
}
</script>
</head>
<body></body>
</html>
