7 oz \/ 200 g    beef rump steak or flank (, or any other quick cooking steak cut (Note 1))","1\/2 tsp baking soda \/ bi-carbonate soda (, for velveting (Note 2))","2 tbsp soy sauce, light or all-purpose (NOT dark soy (Note 4))","1 tbsp oyster sauce","2 tbsp Chinese cooking wine ( OR Mirin (Note 5))","1 tsp white sugar","1\/2 tsp sesame oil (, toasted (brown) not untoasted (yellow))","Pinch  white pepper (, substitute with black pepper)","3 tsp cornstarch \/ corn flour","1\/2 cup water (, separated)","1 1\/2 tbsp peanut oil","1  garlic clove (, finely minced with a knife)","1\/2  small onion (, sliced (yellow, brown or white))","1\/2  red capsicum \/ bell pepper (, sliced into 7mm \/ 1\/3&quot; thick slices)","1  small carrot (, peeled, halved lengthwise and sliced thinly on the diagonal)","2  bok choy (, cut leaves from stems, cut thick stems lengthways to make them all roughly the same width)","2  green onion (, cut into 1.5&quot;\/3cm pieces, firm white end separated from soft green parts)","Steamed white rice","Sesame seeds ((optional))"],"recipeInstructions":[{"@type":"HowToSection","name":"Abbreviated recipe","itemListElement":[{"@type":"HowToStep","text":"Tenderise beef 20 minutes, rinse, toss with 1.5 tbsp sauce. Mix in cornflour then water into Sauce. Stir fry in this order: onion + garlic &gt; beef &gt; carrot + capsicum + bok choy stems + green onion stems &gt; sauce &gt; wilt bok choy leaves + green onion. Serve!","name":"Tenderise beef 20 minutes, rinse, toss with 1.5 tbsp sauce. Mix in cornflour then water into Sauce. Stir fry in this order: onion + garlic &gt; beef &gt; carrot + capsicum + bok choy stems + green onion stems &gt; sauce &gt; wilt bok choy leaves + green onion. Serve!","url":"https:\/\/www.recipetineats.com\/easy-classic-chinese-beef-stir-fry\/#wprm-recipe-22004-step-0-0"}]},{"@type":"HowToSection","name":"Velvet beef (tenderise)","itemListElement":[{"@type":"HowToStep","text":"Velvet beef - Place the beef in a bowl. Sprinkle the baking soda over then use your fingers to toss the beef to coat as evenly as possible. Set aside for 20 minutes (no longer).","name":"Velvet beef - Place the beef in a bowl. Sprinkle the baking soda over then use your fingers to toss the beef to coat as evenly as possible. Set aside for 20 minutes (no longer).","url":"https:\/\/www.recipetineats.com\/easy-classic-chinese-beef-stir-fry\/#wprm-recipe-22004-step-2-0"},{"@type":"HowToStep","text":"Rinse the beef under tap water in a colander to remove baking soda. Shake and pat off excess water (doesn&#39;t need to dry fully, just don&#39;t want it soaking). Put in a bowl.","name":"Rinse the beef under tap water in a colander to remove baking soda. Shake and pat off excess water (doesn&#39;t need to dry fully, just don&#39;t want it soaking). Put in a bowl.","url":"https:\/\/www.recipetineats.com\/easy-classic-chinese-beef-stir-fry\/#wprm-recipe-22004-step-2-1"}]},{"@type":"HowToSection","name":"Cook stir fry","itemListElement":[{"@type":"HowToStep","text":"Sauce - Mix ingredients together. Measure out 1 1\/2 tablespoons and use it to coat the beef. To the remaining sauce, mix in the cornflour until lump-free, then add the water.","name":"Sauce - Mix ingredients together. Measure out 1 1\/2 tablespoons and use it to coat the beef. To the remaining sauce, mix in the cornflour until lump-free, then add the water.","url":"https:\/\/www.recipetineats.com\/easy-classic-chinese-beef-stir-fry\/#wprm-recipe-22004-step-3-0"},{"@type":"HowToStep","text":"Cook aromatics - Heat the oil in a large non-stick pan or wok over high heat. Add the onion and garlic, cook for 10 seconds.","name":"Cook aromatics - Heat the oil in a large non-stick pan or wok over high heat. Add the onion and garlic, cook for 10 seconds.","url":"https:\/\/www.recipetineats.com\/easy-classic-chinese-beef-stir-fry\/#wprm-recipe-22004-step-3-1"},{"@type":"HowToStep","text":"Add the beef and cook until it changes colour from red to light brown but not cooked through."," ype":"Rating","ratingValue":"2"},"reviewBody":"Much better stir fry recipes out there.","author":{"@type":"Person","name":"Arthur Morgan"},"datePublished":"2026-10-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Like they say, there's nothing like a succulent Chinese meal and this definitely hits the spot. Beef so tender, sauce divine, and vegetables very versatile. Just bought your book Tonight Nagi and thrilled about it and used the guide to adding veggies to stir fry. Now you just need to come to Brisbane to sign it and Dinner for me","author":{"@type":"Person","name":"Gregory Buchanan"},"datePublished":"2026-08-24"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Such a delicious healthy meal and only takes a short time to prepare. Great way to use up veges in the fridge.  Looking forward to leftovers tonight! 😊🫶 Thank you Nagi x","author":{"@type":"Person","name":"Jewels"},"datePublished":"2026-08-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Hubby loved it &amp; wanted to know what the meat was because it was so tender! He was amazed when I told him about \"velveting\". I used the vegies I had available - red cabbage, carrot, baby spinach. Tossed in cooked 3 minute noodles at the end. Fantastic recipe that's so adaptable. Thanks again for another dinner winner Nagi! :)","author":{"@type":"Person","name":"Julie"},"datePublished":"2026-08-18"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I made this tonight and it was truly yummy! The velveted beef  was fork tender. I was worried it wouldn't be saucy enough for the amount of rice made so added fish sauce and a few splashes of beef broth. This recipe along with a few of your others are going on my regular meal rotation!","author":{"@type":"Person","name":"Leslie"},"datePublished":"2026-08-17"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I am obsessed with this dish! I make it every week now my husband loves it! Of course I have to add some crushed red pepper seeds that I grow. I have to have everything hot.! Thank you for publishing this, it is amazing!","author":{"@type":"Person","name":"Philomena"},"datePublished":"2026-08-09"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Delish meal! Velveting was so quick and easy. Made the rump fall apart tender. On the rotation","author":{"@type":"Person","name":"Chels"},"datePublished":"2026-07-14"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Absolute wow factor.  Once again you have given me a recipe that thrilled my husband’s tastebuds. Used rump steak, added bean sprouts and mushrooms to the recipe too. A delicious meal, beautiful aroma and colourful plate of goodness. Thank you Nagi ☺️","author":{"@type":"Person","name":"Jeanette Goodier"},"datePublished":"2026-06-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"The ingredients all tie up into a delicious dish that's similar to what you find at the restaurants 😋😋😋. Plus you get to prep the veggies while the meat tenderises so there is no time wastage.","author":{"@type":"Person","name":"Rahab"},"datePublished":"2026-05-16"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"The ingredients all tie up into a delicious dish that's similar to what you find at the restaurants 😋😋😋. Plus you get to prep the veggies while the meat tenderises so there is no time wastage.","author":{"@type":"Person","name":"Rahab"},"datePublished":"2026-05-16"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Fabulous sauce. \r\nAdded fish sauce &amp; the end of cooking to give flavour. Fish sauce is used like salt in Asian cooking. This really lifted the flavour of the sauce.","author":{"@type":"Person","name":"Johnson Sarah"
