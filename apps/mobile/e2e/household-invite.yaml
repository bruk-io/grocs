# TASK-56 and TASK-78, step 1 of 3: Jo, whose kitchen has room, opens the household from Settings and
# invites Pat by email.
appId: io.bruk.grocs.dev
env:
  ACCOUNT: jo
---
- runFlow: subflows/sign-in.yaml
- tapOn: "Settings"
- tapOn: "Household"
- extendedWaitUntil:
    visible: "Jo's kitchen"
    timeout: 10000
# The field, by its placeholder: "Their email" is only its accessibility label.
- tapOn: "name@gmail.com"
- inputText: "pat@grocs.test"
- tapOn: "Invite"
- extendedWaitUntil:
    visible: "Invited pat@grocs.test.*"
    timeout: 20000
