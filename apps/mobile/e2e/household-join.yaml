# TASK-56 and TASK-78, step 2 of 3, on the other device: Pat signs in and is offered Jo's invite to
# pat@grocs.test (from household-invite.yaml) before anything else, and joins it.
appId: io.bruk.grocs.dev
env:
  ACCOUNT: pat
---
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible: "Jo invited you to"
    timeout: 20000
- tapOn: "Join Jo's kitchen"
- extendedWaitUntil:
    visible: "Groceries"
    timeout: 30000
- tapOn: "Settings"
- tapOn: "Household"
- extendedWaitUntil:
    visible: "Jo's kitchen"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*has both its members.*"
    timeout: 15000
