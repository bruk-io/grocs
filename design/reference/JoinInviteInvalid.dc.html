<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join from an invite: invalid code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grocs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-surface-canvas); color: var(--color-ink); font-family: var(--font-body);">
  <header style="padding: var(--space-16) var(--space-20) var(--space-12); display: flex; flex-direction: column; gap: var(--space-10);">
    <div style="min-height: var(--size-target); display: flex; align-items: center;">
      <span style="font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-bold); color: var(--color-forest);">Grocs</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-12);">
      <div style="display: flex; flex-direction: column; gap: var(--space-8); min-width: 0;">
        <span style="align-self: flex-start; padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-surface-tint); color: var(--color-ink-on-tint); font-size: var(--type-small); font-weight: var(--weight-heavy);">Invite code</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); line-height: 1.05;">Code didn't work</h1>
      </div>
      <div style="position: relative; flex: none;">
        <button class="mascot-btn" onClick="{{poke}}" aria-label="Chanty the chanterelle mushroom. Tap to say hi.">
          <span class="{{mushClass}}" style="display: flex;">
            <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" style="overflow: visible;">
              <g class="chanty-strut">
                <path d="M7 18c4-5 10-3 14-6s10-4 15-1 8 1 12 1 9 3 9 8c0 6-9 10-15 14l-3 18a5 5 0 0 1-5 5h-6a5 5 0 0 1-5-5l-3-18C15 30 7 25 7 18z" fill="var(--illo-chanty-body)"></path>
                <path d="M11 17c4-3 9-2 13-4s9-3 13-1 8 1 13 1" fill="none" stroke="var(--illo-chanty-shine)" stroke-width="3" stroke-linecap="round"></path>
                <path d="M27 37l1.5 12M32 37v13M37 37l-1.5 12" fill="none" stroke="var(--illo-chanty-gill)" stroke-width="1.6" stroke-linecap="round"></path>
                <path d="M24.6 22.6l-2.2-1.4M39.4 22.6l2.2-1.4" fill="none" stroke="var(--color-ink)" stroke-width="1.5" stroke-linecap="round"></path>
                <g class="blink"><ellipse cx="27" cy="24" rx="2.2" ry="2.8" fill="var(--color-ink)"></ellipse><ellipse cx="37" cy="24" rx="2.2" ry="2.8" fill="var(--color-ink)"></ellipse></g>
                <ellipse cx="22" cy="29" rx="2.8" ry="1.7" fill="var(--illo-blush)"></ellipse><ellipse cx="42" cy="29" rx="2.8" ry="1.7" fill="var(--illo-blush)"></ellipse>
                <path d="M29 28.5q3 3.2 6 0" fill="none" stroke="var(--color-ink)" stroke-width="1.8" stroke-linecap="round"></path>
              </g>
              <path class="twinkle" d="M55 3l1.2 3.3 3.3 1.2-3.3 1.2L55 12l-1.2-3.3-3.3-1.2 3.3-1.2z" fill="var(--color-chartreuse)" stroke="var(--color-forest)" stroke-width="1"></path>
            </svg>
          </span>
        </button>
        <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="bubble-from-right {{bubbleClass}}" style="position: absolute; right: 76px; top: 2px; z-index: 5; width: max-content; max-width: var(--size-bubble); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line); box-shadow: var(--shadow-float); font-size: var(--type-small); font-weight: var(--weight-bold); line-height: 1.3; color: var(--color-ink);">{{line}}<span style="position: absolute; right: -8px; top: 16px; width: var(--size-dot); height: var(--size-dot); background: var(--color-surface-card); border-right: var(--line-w) solid var(--color-line); border-top: var(--line-w) solid var(--color-line); transform: rotate(45deg);"></span></span>
        </sc-if>
      </div>
    </div>
  </header>
  <span role="status" class="sr">{{liveLine}}</span>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-8) var(--space-20) var(--space-32); display: flex; flex-direction: column; gap: var(--space-24);">
    <div class="rise" style="display: flex; flex-direction: column; gap: var(--space-6); animation-delay: 80ms;">
      <label for="invite-code" style="margin: 0 var(--space-6); font-size: var(--type-body); font-weight: var(--weight-heavy);">Invite code from Bruk</label>
      <input id="invite-code" class="field-box {{fieldClass}}" type="text" value="{{code}}" onInput="{{typeCode}}" autocomplete="off" aria-invalid="{{invalid}}" aria-describedby="code-help" style="height: var(--size-control); box-sizing: border-box; padding: 0 var(--space-18); border-radius: var(--radius-20); outline: none; font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-bold); letter-spacing: var(--tracking-code); text-transform: uppercase; color: var(--color-ink);">
      <sc-if value="{{showError}}" hint-placeholder-val="{{true}}">
        <p id="code-help" role="alert" class="land" style="margin: var(--space-2) var(--space-6) 0; display: flex; align-items: flex-start; gap: var(--space-8); font-size: var(--type-small); font-weight: var(--weight-bold); color: var(--color-error);"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>That code is not a match. Check it with Bruk, or ask for a fresh link.</p>
      </sc-if>
      <sc-if value="{{showHint}}" hint-placeholder-val="{{false}}">
        <p id="code-help" style="margin: var(--space-2) var(--space-6) 0; font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Codes look like MOREL-24.</p>
      </sc-if>
      <sc-if value="{{showOk}}" hint-placeholder-val="{{false}}">
        <p id="code-help" role="status" class="land" style="margin: var(--space-2) 0 0; display: flex; align-items: center; gap: var(--space-8); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-positive-tint); font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-forest);"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>That works. Welcome to Our kitchen!</p>
      </sc-if>
    </div>

    <div class="rise" style="display: flex; flex-direction: column; gap: var(--space-12); animation-delay: 160ms;">
      <sc-if value="{{showCheck}}" hint-placeholder-val="{{true}}">
        <button class="btn btn-m btn-primary" onClick="{{check}}" disabled="{{empty}}">Check code</button>
      </sc-if>
      <sc-if value="{{showOk}}" hint-placeholder-val="{{false}}">
        <a class="btn btn-m btn-primary" href="Plan.dc.html">Join Our kitchen</a>
      </sc-if>
      <a class="btn btn-s btn-text" href="JoinInvite.dc.html" style="align-self: center; min-height: var(--size-target);">Back to my invite</a>
    </div>
    <p style="margin: auto 0 0; text-align: center; font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Not expecting this? You can ignore it.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: 'MOREL-42', error: true, ok: false, pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'chanty-tap-a' : 'chanty-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  renderVals() {
    var self = this;
    var lines = [
      'Oh, darling. That code is not it.',
      'Check the letters. Check the dash!',
      'Bruk has the real one. Ask nicely.'
    ];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    var s = this.state;
    var empty = s.code.trim() === '';
    var liveLine = s.talking ? 'Chanty says: ' + line : '';
    return {
      code: s.code,
      empty: empty,
      invalid: s.error ? 'true' : 'false',
      fieldClass: s.error ? 'is-error' : '',
      showError: s.error,
      showOk: s.ok,
      showHint: !s.error && !s.ok,
      showCheck: !s.ok,
      typeCode: function (e) { self.setState({ code: e.target.value, error: false, ok: false }); },
      check: function () {
        var good = self.state.code.trim().toUpperCase() === 'MOREL-24';
        self.setState({ error: !good, ok: good });
      },
      mushClass: s.react,
      talking: s.talking,
      bubbleClass: s.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: liveLine,
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
</html>
