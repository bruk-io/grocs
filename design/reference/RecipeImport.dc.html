<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parked: recipe import</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grocs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-surface-canvas); color: var(--color-ink); font-family: var(--font-body);">
  <header style="padding: var(--space-16) var(--space-20) var(--space-12); display: flex; flex-direction: column; gap: var(--space-10);">
    <a href="Plan.dc.html" style="align-self: flex-start; margin-left: calc(-1 * var(--space-10)); min-height: var(--size-target); padding: 0 var(--space-12) 0 var(--space-4); display: flex; align-items: center; gap: var(--space-2); border-radius: var(--radius-14); color: var(--color-forest); text-decoration: none; font-size: var(--type-body); font-weight: var(--weight-heavy);">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Meal plan
    </a>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-12);">
      <div style="display: flex; flex-direction: column; gap: var(--space-8); min-width: 0;">
        <span style="align-self: flex-start; padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-surface-tint); color: var(--color-ink-on-tint); font-size: var(--type-small); font-weight: var(--weight-heavy);">Monday, Oct 19</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); line-height: 1.05;">Chana masala</h1>
      </div>
      <div style="position: relative; flex: none;">
        <button class="mascot-btn" onClick="{{poke}}" aria-label="Morty the morel mushroom. Tap to say hi.">
          <span class="{{mushClass}}" style="display: flex;">
            <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" style="overflow: visible;">
              <g class="morty-ponder">
                <path d="M24 36h16l1 18a5 5 0 0 1-5 5h-8a5 5 0 0 1-5-5z" fill="var(--illo-morty-stem)"></path>
                <path d="M32 3c10 0 16 12 16 26 0 6-3 9-8 9H24c-5 0-8-3-8-9C16 15 22 3 32 3z" fill="var(--illo-morty-cap)"></path>
                <g fill="var(--illo-morty-pit)">
                  <ellipse cx="27" cy="13" rx="2.4" ry="3.2"></ellipse><ellipse cx="36.5" cy="12" rx="2.2" ry="3"></ellipse>
                  <ellipse cx="23" cy="23" rx="2.4" ry="3.2"></ellipse><ellipse cx="32" cy="21.5" rx="2.6" ry="3.4"></ellipse><ellipse cx="41" cy="23" rx="2.4" ry="3.2"></ellipse>
                  <ellipse cx="27.5" cy="31" rx="2.6" ry="3"></ellipse><ellipse cx="37" cy="31" rx="2.6" ry="3"></ellipse>
                </g>
                <g class="blink"><ellipse cx="28" cy="45" rx="1.8" ry="2.3" fill="var(--color-ink)"></ellipse><ellipse cx="36" cy="45" rx="1.8" ry="2.3" fill="var(--color-ink)"></ellipse></g>
                <circle cx="28" cy="45" r="3.8" fill="none" stroke="var(--color-ink)" stroke-width="1.4"></circle>
                <circle cx="36" cy="45" r="3.8" fill="none" stroke="var(--color-ink)" stroke-width="1.4"></circle>
                <ellipse cx="23" cy="50.5" rx="2.2" ry="1.4" fill="var(--illo-blush)"></ellipse><ellipse cx="41" cy="50.5" rx="2.2" ry="1.4" fill="var(--illo-blush)"></ellipse>
                <path d="M30 51.5q2 1.6 4 0" fill="none" stroke="var(--color-ink)" stroke-width="1.6" stroke-linecap="round"></path>
              </g>
            </svg>
          </span>
        </button>
        <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="bubble-from-right {{bubbleClass}}" style="position: absolute; right: 76px; top: 2px; z-index: 5; width: max-content; max-width: var(--size-bubble); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line); box-shadow: var(--shadow-float); font-size: var(--type-small); font-weight: var(--weight-bold); line-height: 1.3; color: var(--color-ink);">{{line}}<span style="position: absolute; right: -8px; top: 16px; width: var(--size-dot); height: var(--size-dot); background: var(--color-surface-card); border-right: var(--line-w) solid var(--color-line); border-top: var(--line-w) solid var(--color-line); transform: rotate(45deg);"></span></span>
        </sc-if>
      </div>
    </div>
    <div class="land" style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); padding: var(--space-12) var(--space-12) var(--space-12) var(--space-16); border-radius: var(--radius-20); background: var(--color-meal-amber);">
      <div style="display: flex; flex-direction: column; gap: var(--space-4); min-width: 0;">
        <span style="display: flex; align-items: center; gap: var(--space-6); font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-ink);"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Found {{total}} ingredients</span>
        <span style="display: flex; align-items: center; gap: var(--space-6); font-size: var(--type-small); font-weight: var(--weight-bold); color: var(--color-meal-amber-ink);"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>example.com</span>
      </div>
      <div role="group" aria-label="Servings" style="display: flex; align-items: center; background: var(--color-surface-card); border-radius: var(--radius-18); flex: none;">
        <button onClick="{{dec}}" aria-label="Fewer servings" style="width: var(--size-target); height: var(--size-target); border: 0; background: transparent; color: var(--color-forest); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span style="min-width: 30px; text-align: center; display: flex; flex-direction: column; line-height: 1.1;"><span style="font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-medium);">{{servings}}</span><span style="font-size: var(--type-micro); font-weight: var(--weight-heavy); color: var(--color-ink-muted);">serves</span></span>
        <button onClick="{{inc}}" aria-label="More servings" style="width: var(--size-target); height: var(--size-target); border: 0; background: transparent; color: var(--color-forest); display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
  </header>
  <span role="status" class="sr">{{liveLine}}</span>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-16) var(--size-nav-clearance); display: flex; flex-direction: column; gap: var(--space-10);">
    <p style="margin: var(--space-2) var(--space-6) 0; font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Things already on your list and pantry staples start unticked.</p>
    <div style="display: flex; flex-direction: column; gap: var(--space-6);">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
        <button class="press rise" onClick="{{row.toggle}}" aria-pressed="{{row.pressed}}" style="width: 100%; min-height: var(--size-row); display: flex; align-items: center; gap: var(--space-14); padding: var(--space-8) var(--space-14); border: var(--line-w) solid var(--color-line-soft); border-radius: var(--radius-20); background: var(--color-surface-card); font: inherit; color: inherit; text-align: left; cursor: pointer; animation-delay: {{row.delay}};">
          <sc-if value="{{row.on}}" hint-placeholder-val="{{true}}">
            <span aria-hidden="true" class="pop" style="width: var(--size-check); height: var(--size-check); flex: none; border-radius: 50%; background: var(--color-forest); color: var(--color-on-brand); display: flex; align-items: center; justify-content: center;"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          </sc-if>
          <sc-if value="{{row.off}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="width: var(--size-check); height: var(--size-check); flex: none; box-sizing: border-box; border-radius: 50%; border: var(--line-w-strong) solid var(--color-forest);"></span>
          </sc-if>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2);">
            <span style="font-size: var(--type-label); font-weight: var(--weight-heavy);">{{row.name}}</span>
            <span style="font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">{{row.qty}}</span>
          </span>
          <sc-if value="{{row.onList}}" hint-placeholder-val="{{false}}">
            <span style="flex: none; font-size: var(--type-micro); font-weight: var(--weight-heavy); padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-positive-tint); color: var(--color-forest);">On your list</span>
          </sc-if>
          <sc-if value="{{row.staple}}" hint-placeholder-val="{{false}}">
            <span style="flex: none; font-size: var(--type-micro); font-weight: var(--weight-heavy); padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-tag-neutral); color: var(--color-tag-neutral-ink);">Pantry staple</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </main>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex;">
    <a href="Main.dc.html" style="flex: 1; height: var(--size-control); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-20); background: var(--color-forest); color: var(--color-on-brand); text-decoration: none; font-weight: var(--weight-heavy); font-size: var(--type-label); box-shadow: var(--shadow-action);">Add {{selected}} items to Groceries</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.base = [
      { id: 'chick', name: 'Chickpeas', amt: 2, u: 'can (540 ml)', us: 'cans (540 ml)', status: 'list' },
      { id: 'onion', name: 'Yellow onion', amt: 1, u: '', us: '' },
      { id: 'tom', name: 'Crushed tomatoes', amt: 1, u: 'can (796 ml)', us: 'cans (796 ml)' },
      { id: 'garlic', name: 'Garlic', amt: 4, u: 'clove', us: 'cloves' },
      { id: 'ginger', name: 'Fresh ginger', amt: 3, u: 'cm piece', us: 'cm piece' },
      { id: 'cil', name: 'Cilantro', amt: 1, u: 'bunch', us: 'bunches', status: 'list' },
      { id: 'rice', name: 'Basmati rice', amt: 1.5, u: 'cup', us: 'cups', status: 'list' },
      { id: 'lemon', name: 'Lemon', amt: 1, u: '', us: '' },
      { id: 'garam', name: 'Garam masala', amt: 2, u: 'tsp', us: 'tsp', status: 'staple' },
      { id: 'cumin', name: 'Ground cumin', amt: 1, u: 'tsp', us: 'tsp', status: 'staple' },
      { id: 'oil', name: 'Vegetable oil', amt: 2, u: 'tbsp', us: 'tbsp', status: 'staple' },
      { id: 'salt', name: 'Salt', amt: null, u: 'to taste', us: 'to taste', status: 'staple' }
    ];
    var sel = {};
    this.base.forEach(function (b) { sel[b.id] = !b.status; });
    this.state = { servings: 4, sel: sel, pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'morty-tap-a' : 'morty-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  fmt(x) {
    var r = Math.round(x * 4) / 4;
    if (r <= 0) r = 0.25;
    var whole = Math.floor(r);
    var frac = r - whole;
    var f = frac === 0.25 ? '¼' : frac === 0.5 ? '½' : frac === 0.75 ? '¾' : '';
    return (whole > 0 ? String(whole) : '') + f;
  }
  renderVals() {
    var self = this;
    var scale = this.state.servings / 4;
    var sel = this.state.sel;
    var rows = this.base.map(function (b, idx) {
      var qty;
      if (b.amt === null) {
        qty = b.u;
      } else {
        var a = b.amt * scale;
        var unit = a > 1 ? b.us : b.u;
        qty = self.fmt(a) + (unit ? ' ' + unit : '');
      }
      var on = !!sel[b.id];
      return {
        name: b.name,
        qty: qty,
        on: on,
        off: !on,
        pressed: on ? 'true' : 'false',
        onList: b.status === 'list',
        staple: b.status === 'staple',
        delay: (idx * 40) + 'ms',
        toggle: function () {
          var next = Object.assign({}, self.state.sel);
          next[b.id] = !next[b.id];
          self.setState({ sel: next });
        }
      };
    });
    var count = rows.filter(function (r) { return r.on; }).length;
    var lines = [
      'Found ' + rows.length + ' ingredients. I counted twice.',
      'Scaled for ' + this.state.servings + '. Maths!',
      "Fun fact: I'm mostly holes.",
      'Staples start unticked. Logic.'
    ];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    return {
      rows: rows,
      total: String(rows.length),
      selected: String(count),
      servings: String(this.state.servings),
      dec: function () { self.setState({ servings: Math.max(1, self.state.servings - 1) }); },
      inc: function () { self.setState({ servings: Math.min(12, self.state.servings + 1) }); },
      mushClass: this.state.react,
      talking: this.state.talking,
      bubbleClass: this.state.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: this.state.talking ? 'Morty says: ' + line : '',
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
</html>
