<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a meal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grocs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-surface-canvas); color: var(--color-ink); font-family: var(--font-body);">
  <header style="padding: var(--space-16) var(--space-20) var(--space-12); display: flex; flex-direction: column; gap: var(--space-10);">
    <a href="Plan.dc.html" style="align-self: flex-start; margin-left: calc(-1 * var(--space-10)); min-height: var(--size-target); padding: 0 var(--space-12) 0 var(--space-4); display: flex; align-items: center; gap: var(--space-2); border-radius: var(--radius-14); color: var(--color-forest); text-decoration: none; font-size: var(--type-body); font-weight: var(--weight-heavy);">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Meal plan
    </a>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-12);">
      <div style="display: flex; flex-direction: column; gap: var(--space-8); min-width: 0;">
        <span style="align-self: flex-start; padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-surface-tint); color: var(--color-ink-on-tint); font-size: var(--type-small); font-weight: var(--weight-heavy);">Thursday, Oct 22</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); line-height: 1.05;">Add a meal</h1>
      </div>
      <div style="position: relative; flex: none;">
        <button class="mascot-btn" onClick="{{poke}}" aria-label="Chanty the chanterelle mushroom. Tap to say hi.">
          <span class="{{mushClass}}" style="display: flex;">
            <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" style="overflow: visible;">
              <g class="chanty-strut">
                <path d="M7 18c4-5 10-3 14-6s10-4 15-1 8 1 12 1 9 3 9 8c0 6-9 10-15 14l-3 18a5 5 0 0 1-5 5h-6a5 5 0 0 1-5-5l-3-18C15 30 7 25 7 18z" fill="var(--illo-chanty-body)"></path>
                <path d="M11 17c4-3 9-2 13-4s9-3 13-1 8 1 13 1" fill="none" stroke="var(--illo-chanty-shine)" stroke-width="3" stroke-linecap="round"></path>
                <path d="M27 37l1.5 12M32 37v13M37 37l-1.5 12" fill="none" stroke="var(--illo-chanty-gill)" stroke-width="1.6" stroke-linecap="round"></path>
                <path d="M24.6 22.6l-2.2-1.4M39.4 22.6l2.2-1.4" fill="none" stroke="var(--color-ink)" stroke-width="1.5" stroke-linecap="round"></path>
                <g class="blink"><ellipse cx="27" cy="24" rx="2.2" ry="2.8" fill="var(--color-ink)"></ellipse><ellipse cx="37" cy="24" rx="2.2" ry="2.8" fill="var(--color-ink)"></ellipse></g>
                <ellipse cx="22" cy="29" rx="2.8" ry="1.7" fill="var(--illo-blush)"></ellipse><ellipse cx="42" cy="29" rx="2.8" ry="1.7" fill="var(--illo-blush)"></ellipse>
                <path d="M29 28.5q3 3.2 6 0" fill="none" stroke="var(--color-ink)" stroke-width="1.8" stroke-linecap="round"></path>
              </g>
              <path class="twinkle" d="M55 3l1.2 3.3 3.3 1.2-3.3 1.2L55 12l-1.2-3.3-3.3-1.2 3.3-1.2z" fill="var(--color-chartreuse)" stroke="var(--color-forest)" stroke-width="1"></path>
            </svg>
          </span>
        </button>
        <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="bubble-from-right {{bubbleClass}}" style="position: absolute; right: 76px; top: 2px; z-index: 5; width: max-content; max-width: var(--size-bubble); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line); box-shadow: var(--shadow-float); font-size: var(--type-small); font-weight: var(--weight-bold); line-height: 1.3; color: var(--color-ink);">{{line}}<span style="position: absolute; right: -8px; top: 16px; width: var(--size-dot); height: var(--size-dot); background: var(--color-surface-card); border-right: var(--line-w) solid var(--color-line); border-top: var(--line-w) solid var(--color-line); transform: rotate(45deg);"></span></span>
        </sc-if>
      </div>
    </div>
  </header>
  <span role="status" class="sr">{{liveLine}}</span>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-8) var(--space-20) var(--size-nav-clearance); display: flex; flex-direction: column; gap: var(--space-24);">
    <div class="rise" style="display: flex; flex-direction: column; gap: var(--space-6); animation-delay: 80ms;">
      <label for="meal-name" style="margin: 0 var(--space-6); font-size: var(--type-body); font-weight: var(--weight-heavy);">What are you making?</label>
      <input id="meal-name" class="field-box" type="text" value="Fried rice" style="height: var(--size-control); box-sizing: border-box; padding: 0 var(--space-18); border-radius: var(--radius-20); outline: none; font: inherit; font-size: var(--type-label); font-weight: var(--weight-bold); color: var(--color-ink);">
    </div>
    <div class="rise" style="display: flex; flex-direction: column; gap: var(--space-6); animation-delay: 160ms;">
      <label for="meal-link" style="margin: 0 var(--space-6); font-size: var(--type-body); font-weight: var(--weight-heavy);">Recipe link <span style="font-weight: var(--weight-medium); color: var(--color-ink-muted);">(optional)</span></label>
      <div class="field-box" style="display: flex; gap: var(--space-8); align-items: center; border-radius: var(--radius-20); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-18);">
        <input id="meal-link" type="url" placeholder="Paste a link" style="flex: 1; min-width: 0; height: var(--size-target); border: 0; outline: none; background: transparent; font: inherit; font-size: var(--type-label); font-weight: var(--weight-medium); color: var(--color-ink);">
        <button style="height: var(--size-target); padding: 0 var(--space-16); border: 0; border-radius: var(--radius-16); background: var(--color-surface-tint); color: var(--color-forest); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); cursor: pointer;">Paste</button>
      </div>
      <p style="margin: var(--space-2) var(--space-6) 0; font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Saved with the meal, so the recipe is easy to find again.</p>
    </div>
  </main>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex;">
    <a href="Plan.dc.html" style="flex: 1; height: var(--size-control); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-20); background: var(--color-forest); color: var(--color-on-brand); text-decoration: none; font-weight: var(--weight-heavy); font-size: var(--type-label); box-shadow: var(--shadow-action);">Add to Thursday</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'chanty-tap-a' : 'chanty-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  renderVals() {
    var self = this;
    var lines = [
      'Fried rice? Exquisite choice, darling.',
      'A link is divine. Optional, but divine.',
      'Golden. Like me.',
      'Add butter. Always butter.'
    ];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    return {
      mushClass: this.state.react,
      talking: this.state.talking,
      bubbleClass: this.state.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: this.state.talking ? 'Chanty says: ' + line : '',
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
</html>
