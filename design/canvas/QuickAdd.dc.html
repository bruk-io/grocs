<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add an item</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grocs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-surface-canvas); color: var(--color-ink); font-family: var(--font-body);">
  <header style="padding: var(--space-16) var(--space-20) var(--space-12); display: flex; flex-direction: column; gap: var(--space-10);">
    <a href="Main.dc.html" style="align-self: flex-start; margin-left: calc(-1 * var(--space-10)); min-height: var(--size-target); padding: 0 var(--space-12) 0 var(--space-4); display: flex; align-items: center; gap: var(--space-2); border-radius: var(--radius-14); color: var(--color-forest); text-decoration: none; font-size: var(--type-body); font-weight: var(--weight-heavy);">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Groceries
    </a>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-12);">
      <div style="display: flex; flex-direction: column; gap: var(--space-8); min-width: 0;">
        <span style="align-self: flex-start; padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-surface-tint); color: var(--color-ink-on-tint); font-size: var(--type-small); font-weight: var(--weight-heavy);">Week of Oct 19</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); line-height: 1.05;">Add an item</h1>
      </div>
      <div style="position: relative; flex: none;">
        <button class="mascot-btn" onClick="{{poke}}" aria-label="Ollie the oyster mushroom. Tap to say hi.">
          <span class="{{mushClass}}" style="display: flex;">
            <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" style="overflow: visible;">
              <g class="ollie-lean">
                <path d="M30 42h8l1 12a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z" fill="var(--illo-ollie-stem)"></path>
                <path d="M6 36C6 21 18 11 34 11c13 0 24 7 24 18 0 8-6 12-14 13l-24 2C12 44 6 42 6 36z" fill="var(--illo-ollie-cap)"></path>
                <path d="M12 39c4 1.6 8 .8 12 1.6s8 0 12 .8 8-.8 10-1.6" fill="none" stroke="var(--illo-ollie-rim)" stroke-width="2.6" stroke-linecap="round"></path>
                <path d="M20 18c4-3 9-4 14-4M14 25c5-6 13-9 22-9" fill="none" stroke="var(--illo-ollie-line)" stroke-width="1.6" stroke-linecap="round"></path>
                <g class="blink"><ellipse cx="26" cy="29" rx="2" ry="2.4" fill="var(--color-ink)"></ellipse><ellipse cx="35" cy="29" rx="2" ry="2.4" fill="var(--color-ink)"></ellipse></g>
                <ellipse cx="21.5" cy="33.5" rx="3.4" ry="2" fill="var(--illo-blush)"></ellipse><ellipse cx="39.5" cy="33.5" rx="3.4" ry="2" fill="var(--illo-blush)"></ellipse>
                <path d="M28.5 34.5q1.2-1 2.4 0t2.4 0" fill="none" stroke="var(--color-ink)" stroke-width="1.6" stroke-linecap="round"></path>
              </g>
            </svg>
          </span>
        </button>
        <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="bubble-from-right {{bubbleClass}}" style="position: absolute; right: 76px; top: 2px; z-index: 5; width: max-content; max-width: var(--size-bubble); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line); box-shadow: var(--shadow-float); font-size: var(--type-small); font-weight: var(--weight-bold); line-height: 1.3; color: var(--color-ink);">{{line}}<span style="position: absolute; right: -8px; top: 16px; width: var(--size-dot); height: var(--size-dot); background: var(--color-surface-card); border-right: var(--line-w) solid var(--color-line); border-top: var(--line-w) solid var(--color-line); transform: rotate(45deg);"></span></span>
        </sc-if>
      </div>
    </div>
  </header>
  <span role="status" class="sr">{{liveLine}}</span>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-8) var(--space-20) var(--space-32); display: flex; flex-direction: column; gap: var(--space-20);">
    <div style="display: flex; flex-direction: column; gap: var(--space-8);">
      <div class="field-box is-focus" style="display: flex; gap: var(--space-8); align-items: center; border-radius: var(--radius-20); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-18);">
        <label for="qa-input" class="sr">Item name</label>
        <input id="qa-input" type="text" value="egg" style="flex: 1; min-width: 0; height: var(--size-target); border: 0; outline: none; background: transparent; font: inherit; font-size: var(--type-label); font-weight: var(--weight-bold); color: var(--color-ink);">
        <button style="height: var(--size-target); padding: 0 var(--space-18); border: 0; border-radius: var(--radius-16); background: var(--color-forest); color: var(--color-on-brand); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); cursor: pointer;">Add</button>
      </div>
      <p style="margin: 0 var(--space-6); font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Paste a few items at once, one per line.</p>
    </div>

    <section style="display: flex; flex-direction: column; gap: var(--space-10);">
      <h2 style="margin: 0 var(--space-6); font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-medium);">For a meal <span style="font-family: var(--font-body); font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">(optional)</span></h2>
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-8);">
        <button class="chip pop-in" aria-pressed="false" style="min-height: var(--size-target); padding: 0 var(--space-16); border: 0; border-radius: var(--radius-pill); background: var(--color-meal-amber); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-meal-amber-ink); cursor: pointer; animation-delay: 60ms;">Chana masala</button>
        <button class="chip pop-in" aria-pressed="false" style="min-height: var(--size-target); padding: 0 var(--space-16); border: 0; border-radius: var(--radius-pill); background: var(--color-meal-sky); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-meal-sky-ink); cursor: pointer; animation-delay: 110ms;">Sheet-pan chicken</button>
        <button class="chip pop-in" aria-pressed="false" style="min-height: var(--size-target); padding: 0 var(--space-16); border: 0; border-radius: var(--radius-pill); background: var(--color-meal-tomato); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-meal-tomato-ink); cursor: pointer; animation-delay: 160ms;">Pizza night</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-8);">
      <h2 style="margin: 0 var(--space-6); font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-medium);">Suggestions</h2>
      <div style="display: flex; flex-direction: column; gap: var(--space-6);">
        <button class="press rise" style="width: 100%; min-height: var(--size-row); display: flex; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-10) var(--space-8) var(--space-16); border: var(--line-w) solid var(--color-line-soft); border-radius: var(--radius-20); background: var(--color-surface-card); font: inherit; color: inherit; text-align: left; cursor: pointer; animation-delay: 120ms;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2);">
            <span style="font-size: var(--type-label); font-weight: var(--weight-heavy);">Eggs</span>
            <span style="font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Dairy &amp; eggs · usually 1 dozen</span>
          </span>
          <span aria-hidden="true" style="width: var(--size-target); height: var(--size-target); border-radius: var(--radius-16); background: var(--color-surface-tint); color: var(--color-forest); display: flex; align-items: center; justify-content: center;"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
        </button>
        <button class="press rise" style="width: 100%; min-height: var(--size-row); display: flex; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-10) var(--space-8) var(--space-16); border: var(--line-w) solid var(--color-line-soft); border-radius: var(--radius-20); background: var(--color-surface-card); font: inherit; color: inherit; text-align: left; cursor: pointer; animation-delay: 170ms;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2);">
            <span style="font-size: var(--type-label); font-weight: var(--weight-heavy);">Egg noodles</span>
            <span style="font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Pantry</span>
          </span>
          <span aria-hidden="true" style="width: var(--size-target); height: var(--size-target); border-radius: var(--radius-16); background: var(--color-surface-tint); color: var(--color-forest); display: flex; align-items: center; justify-content: center;"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
        </button>
        <button class="press rise" style="width: 100%; min-height: var(--size-row); display: flex; align-items: center; gap: var(--space-12); padding: var(--space-8) var(--space-10) var(--space-8) var(--space-16); border: var(--line-w) solid var(--color-line-soft); border-radius: var(--radius-20); background: var(--color-surface-card); font: inherit; color: inherit; text-align: left; cursor: pointer; animation-delay: 220ms;">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2);">
            <span style="font-size: var(--type-label); font-weight: var(--weight-heavy);">Eggplant</span>
            <span style="font-size: var(--type-small); font-weight: var(--weight-medium); color: var(--color-ink-muted);">Produce</span>
          </span>
          <span aria-hidden="true" style="width: var(--size-target); height: var(--size-target); border-radius: var(--radius-16); background: var(--color-surface-tint); color: var(--color-forest); display: flex; align-items: center; justify-content: center;"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-10);">
      <h2 style="margin: 0 var(--space-6); font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-medium);">You buy often</h2>
      <div style="display: flex; flex-wrap: wrap; gap: var(--space-8);">
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 260ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Bananas</button>
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 300ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Limes</button>
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 340ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Coffee beans</button>
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 380ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Greek yogurt</button>
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 420ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sourdough loaf</button>
        <button class="chip pop-in" style="min-height: var(--size-target); padding: 0 var(--space-14); display: flex; align-items: center; gap: var(--space-6); border: var(--line-w) solid var(--color-line); border-radius: var(--radius-pill); background: var(--color-surface-card); font: inherit; font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink); cursor: pointer; animation-delay: 460ms;"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-forest)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Baby spinach</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'ollie-tap-a' : 'ollie-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  renderVals() {
    var self = this;
    var lines = [
      'Oh! Um... eggs, maybe?',
      'You buy bananas a lot... no judgement.',
      "Sorry. I'll be quiet.",
      '...hi.'
    ];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    return {
      mushClass: this.state.react,
      talking: this.state.talking,
      bubbleClass: this.state.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: this.state.talking ? 'Ollie says: ' + line : '',
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
</html>
