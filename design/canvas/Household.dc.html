<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your kitchen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="grocs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-surface-canvas); color: var(--color-ink); font-family: var(--font-body);">
  <header style="padding: var(--space-16) var(--space-20) var(--space-12); display: flex; flex-direction: column; gap: var(--space-10);">
    <div style="min-height: var(--size-target); display: flex; align-items: center;">
      <span style="font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-ink-muted);">Signed in as you@example.com</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-12);">
      <div style="display: flex; flex-direction: column; gap: var(--space-8); min-width: 0;">
        <span style="align-self: flex-start; padding: var(--space-4) var(--space-10); border-radius: var(--radius-pill); background: var(--color-surface-tint); color: var(--color-ink-on-tint); font-size: var(--type-small); font-weight: var(--weight-heavy);">Last step</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); line-height: 1.05;">Your kitchen</h1>
      </div>
      <div style="position: relative; flex: none;">
        <button class="mascot-btn" onClick="{{poke}}" aria-label="The enoki siblings. Tap to say hi.">
          <span class="{{mushClass}}" style="display: flex;">
            <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true" class="enoki-bob" style="overflow: visible;">
              <g class="enoki-stalk enoki-1">
                <path d="M20 56C18 43 16 30 13 17" fill="none" stroke="var(--illo-enoki-edge)" stroke-width="7" stroke-linecap="round"></path>
                <path d="M20 56C18 43 16 30 13 17" fill="none" stroke="var(--illo-enoki-stem)" stroke-width="4.5" stroke-linecap="round"></path>
                <circle cx="13" cy="15" r="5" fill="var(--illo-enoki-cap)" stroke="var(--illo-enoki-edge)" stroke-width="1.5"></circle>
              </g>
              <g class="enoki-stalk enoki-3">
                <path d="M44 56c2-13 4-26 7-39" fill="none" stroke="var(--illo-enoki-edge)" stroke-width="7" stroke-linecap="round"></path>
                <path d="M44 56c2-13 4-26 7-39" fill="none" stroke="var(--illo-enoki-stem)" stroke-width="4.5" stroke-linecap="round"></path>
                <circle cx="51" cy="15" r="5" fill="var(--illo-enoki-cap)" stroke="var(--illo-enoki-edge)" stroke-width="1.5"></circle>
              </g>
              <g class="enoki-stalk enoki-2">
                <path d="M32 57V22" fill="none" stroke="var(--illo-enoki-edge)" stroke-width="14" stroke-linecap="round"></path>
                <path d="M32 57V22" fill="none" stroke="var(--illo-enoki-stem)" stroke-width="11.5" stroke-linecap="round"></path>
                <ellipse cx="32" cy="17" rx="10" ry="7.5" fill="var(--illo-enoki-cap)" stroke="var(--illo-enoki-edge)" stroke-width="1.5"></ellipse>
                <path d="M27.6 32q1.7-2.2 3.4 0M33 32q1.7-2.2 3.4 0" fill="none" stroke="var(--color-ink)" stroke-width="1.6" stroke-linecap="round"></path>
                <circle cx="27" cy="35.5" r="1.4" fill="var(--illo-blush)"></circle><circle cx="37" cy="35.5" r="1.4" fill="var(--illo-blush)"></circle>
                <path d="M30 36q2 3.4 4 0z" fill="var(--color-ink)"></path>
              </g>
              <path d="M14 55h36a3.5 3.5 0 0 1 0 7H14a3.5 3.5 0 0 1 0-7z" fill="var(--illo-enoki-base)"></path>
            </svg>
          </span>
        </button>
        <sc-if value="{{talking}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" class="bubble-from-right {{bubbleClass}}" style="position: absolute; right: 76px; top: 2px; z-index: 5; width: max-content; max-width: var(--size-bubble); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line); box-shadow: var(--shadow-float); font-size: var(--type-small); font-weight: var(--weight-bold); line-height: 1.3; color: var(--color-ink);">{{line}}<span style="position: absolute; right: -8px; top: 16px; width: var(--size-dot); height: var(--size-dot); background: var(--color-surface-card); border-right: var(--line-w) solid var(--color-line); border-top: var(--line-w) solid var(--color-line); transform: rotate(45deg);"></span></span>
        </sc-if>
      </div>
    </div>
  </header>
  <span role="status" class="sr">{{liveLine}}</span>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-8) var(--space-20) var(--size-nav-clearance); display: flex; flex-direction: column; gap: var(--space-24);">
    <div class="rise" style="display: flex; flex-direction: column; gap: var(--space-6); animation-delay: 80ms;">
      <label for="kitchen-name" style="margin: 0 var(--space-6); font-size: var(--type-body); font-weight: var(--weight-heavy);">Name your kitchen</label>
      <input id="kitchen-name" class="field-box" type="text" value="Our kitchen" style="height: var(--size-control); box-sizing: border-box; padding: 0 var(--space-18); border-radius: var(--radius-20); outline: none; font: inherit; font-size: var(--type-label); font-weight: var(--weight-bold); color: var(--color-ink);">
    </div>

    <section class="rise" style="display: flex; flex-direction: column; gap: var(--space-14); padding: var(--space-18); border-radius: var(--radius-24); background: var(--color-surface-card); border: var(--line-w) solid var(--color-line-soft); animation-delay: 160ms;">
      <div style="display: flex; flex-direction: column; gap: var(--space-4);">
        <h2 style="margin: 0; font-family: var(--font-display); font-size: var(--type-heading); font-weight: var(--weight-medium);">Invite your partner</h2>
        <p style="margin: 0; font-size: var(--type-body); font-weight: var(--weight-medium); color: var(--color-ink-muted);">They get the same plan and list, live on their phone.</p>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-14); border-radius: var(--radius-18); background: var(--color-surface-canvas); border: var(--line-w) dashed var(--color-line-dashed);">
        <span style="font-size: var(--type-caption); font-weight: var(--weight-heavy); letter-spacing: var(--tracking-code); text-transform: uppercase; color: var(--color-ink-muted);">Invite code</span>
        <span style="font-family: var(--font-display); font-size: var(--type-title-m); font-weight: var(--weight-bold); letter-spacing: var(--tracking-code); color: var(--color-forest);">MOREL-24</span>
      </div>
      <div style="display: flex; gap: var(--space-8);">
        <button class="btn" onClick="{{share}}" style="flex: 1; height: var(--size-target); border: 0; border-radius: var(--radius-16); background: var(--color-forest); color: var(--color-on-brand); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--space-8);">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>
          Share link
        </button>
        <button class="btn" onClick="{{copy}}" style="flex: 1; height: var(--size-target); box-sizing: border-box; border: var(--line-w) solid var(--color-line); border-radius: var(--radius-16); background: var(--color-surface-card); color: var(--color-ink); font: inherit; font-size: var(--type-body); font-weight: var(--weight-heavy); cursor: pointer;">{{copyLabel}}</button>
      </div>

      <sc-if value="{{waiting}}" hint-placeholder-val="{{false}}">
        <div class="land" style="display: flex; align-items: center; gap: var(--space-12); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-surface-done);">
          <span aria-hidden="true" style="position: relative; width: var(--size-dot); height: var(--size-dot); margin: 0 var(--space-6);"><span class="pulse" style="position: absolute; inset: 0; border-radius: 50%; background: var(--color-tomato);"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: var(--color-tomato);"></span></span>
          <span style="font-size: var(--type-body); font-weight: var(--weight-bold); color: var(--color-ink-muted);">Link sent. Waiting for them to join…</span>
        </div>
      </sc-if>
      <sc-if value="{{joined}}" hint-placeholder-val="{{false}}">
        <div class="land" style="display: flex; align-items: center; gap: var(--space-12); padding: var(--space-10) var(--space-12); border-radius: var(--radius-16); background: var(--color-positive-tint);">
          <span style="width: var(--size-avatar-l); height: var(--size-avatar-l); border-radius: 50%; background: var(--color-chartreuse); color: var(--color-ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: var(--type-body); font-weight: var(--weight-medium);"><span aria-hidden="true">S</span></span>
          <span style="flex: 1; font-size: var(--type-body); font-weight: var(--weight-heavy); color: var(--color-forest);">Shazya joined your kitchen!</span>
        </div>
      </sc-if>
    </section>
  </main>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; align-items: stretch; gap: var(--space-6);">
    <a href="Plan.dc.html" style="height: var(--size-control); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-20); background: var(--color-forest); color: var(--color-on-brand); text-decoration: none; font-weight: var(--weight-heavy); font-size: var(--type-label); box-shadow: var(--shadow-action);">Start planning</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { invited: false, joined: false, copied: false, pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); clearTimeout(this.jt); clearTimeout(this.ct); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'enoki-tap-a' : 'enoki-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  renderVals() {
    var self = this;
    var lines = this.state.joined
      ? ["Shazya's here! Group hug!", 'Now we are a proper kitchen.', 'Three of us, two of you. Perfect.']
      : ['A kitchen! For us?', 'Invite them! More the merrier!', 'We share everything. Even stems.'];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    return {
      waiting: this.state.invited && !this.state.joined,
      joined: this.state.joined,
      copyLabel: this.state.copied ? 'Copied!' : 'Copy code',
      share: function () {
        if (self.state.invited) return;
        self.setState({ invited: true });
        self.jt = setTimeout(function () {
          self.setState({ joined: true, pk: 0 });
          self.poke();
        }, 2200);
      },
      copy: function () {
        self.setState({ copied: true });
        clearTimeout(self.ct);
        self.ct = setTimeout(function () { self.setState({ copied: false }); }, 1600);
      },
      mushClass: this.state.react,
      talking: this.state.talking,
      bubbleClass: this.state.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: this.state.joined && !this.state.talking ? 'Shazya joined your kitchen.' : (this.state.talking ? 'The enoki say: ' + line : ''),
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
</html>
