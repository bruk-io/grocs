<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pk: 0, react: '', talking: false };
  }
  componentWillUnmount() { clearTimeout(this.rt); clearTimeout(this.tt); }
  poke() {
    var self = this;
    var n = this.state.pk + 1;
    this.setState({ pk: n, react: n % 2 ? 'shii-tap-a' : 'shii-tap-b', talking: true });
    clearTimeout(this.rt); clearTimeout(this.tt);
    this.rt = setTimeout(function () { self.setState({ react: '' }); }, 1300);
    this.tt = setTimeout(function () { self.setState({ talking: false }); }, 2800);
  }
  renderVals() {
    var self = this;
    // Same list, same rule as Main: the badge counts items not yet in the cart.
    var list = [
      { id: 'onion' }, { id: 'garlic' }, { id: 'pep' }, { id: 'lemon' }, { id: 'ginger' }, { id: 'cil' },
      { id: 'ban', checked: true }, { id: 'chicken' }, { id: 'mozz' }, { id: 'oat' }, { id: 'egg' }, { id: 'dough' },
      { id: 'bread', checked: true }, { id: 'chick' }, { id: 'tom' }, { id: 'rice' }, { id: 'coffee', checked: true }
    ];
    var remaining = list.filter(function (i) { return !i.checked; }).length;
    var lines = [
      'Mm? Oh. Thursday is still empty.',
      'Plan once, shop once, nap often.',
      'Five more minutes...',
      'Pizza night is Friday. I checked.'
    ];
    var line = lines[(Math.max(this.state.pk, 1) - 1) % lines.length];
    return {
      mushClass: this.state.react + (this.state.talking ? ' shii-awake' : ''),
      remaining: String(remaining),
      talking: this.state.talking,
      bubbleClass: this.state.pk % 2 ? 'bubble-pop-a' : 'bubble-pop-b',
      line: line,
      liveLine: this.state.talking ? 'Shii says: ' + line : '',
      poke: function () { self.poke(); }
    };
  }
}
</script>
</body>
